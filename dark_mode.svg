<svg xmlns="http://www.w3.org/2000/svg" width="500" height="270" viewBox="0 0 500 270">
  <style>
    .card { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    .title { font: 600 18px 'Courier New', Courier, monospace; fill: #58a6ff; }
    .stat { font: 14px 'Courier New', Courier, monospace; fill: #c9d1d9; white-space: pre; }
    .dots { fill: #484f58; }
    .value { fill: #79c0ff; font-weight: 600; }
    .icon { fill: #79c0ff; }
  </style>

  <rect class="card" x="0.5" y="0.5" width="499" height="269" rx="10"/>

  <text x="25" y="38" class="title">Anant's GitHub Stats</text>
  <line x1="25" y1="50" x2="475" y2="50" stroke="#30363d" stroke-width="1"/>

  <text x="25" y="80" class="stat" xml:space="preserve">🎂 Age:<tspan id="age_data_dots" class="dots"> ..................... </tspan><tspan id="age_data" class="value">--</tspan></text>

  <text x="25" y="106" class="stat" xml:space="preserve">📦 Repositories:<tspan id="repo_data_dots" class="dots"> ......... </tspan><tspan id="repo_data" class="value">--</tspan></text>

  <text x="25" y="132" class="stat" xml:space="preserve">🤝 Contributed To:<tspan id="contrib_data_dots" class="dots"> ....... </tspan><tspan id="contrib_data" class="value">--</tspan></text>

  <text x="25" y="158" class="stat" xml:space="preserve">💾 Total Commits:<tspan id="commit_data_dots" class="dots"> ........ </tspan><tspan id="commit_data" class="value">--</tspan></text>

  <text x="25" y="184" class="stat" xml:space="preserve">🌟 Total Stars:<tspan id="star_data_dots" class="dots"> .......... </tspan><tspan id="star_data" class="value">--</tspan></text>

  <text x="25" y="210" class="stat" xml:space="preserve">👥 Followers:<tspan id="follower_data_dots" class="dots"> ........... </tspan><tspan id="follower_data" class="value">--</tspan></text>

  <line x1="25" y1="222" x2="475" y2="222" stroke="#30363d" stroke-width="1"/>

  <text x="25" y="244" class="stat" xml:space="preserve">📈 Lines of Code:<tspan id="loc_data_dots" class="dots"> ........ </tspan><tspan id="loc_data" class="value">--</tspan></text>

  <text x="25" y="262" class="stat" xml:space="preserve">   (<tspan id="loc_add" class="value" fill="#3fb950">--</tspan>++, <tspan id="loc_del" class="value" fill="#f85149">--</tspan>--<tspan id="loc_del_dots" class="dots"></tspan>)</text>
</svg>
